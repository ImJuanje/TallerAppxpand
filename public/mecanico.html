<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0b1b3a">
<title>Mecánico · Taller AppXpand</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1b3a;font:16px/1.5 Barlow,system-ui,sans-serif;color:#14213d}
.card{width:100%;max-width:400px;background:#fff;border-radius:10px;padding:26px 24px}
h1{font:700 1.6rem "Barlow Semi Condensed";margin:0 0 6px}p{margin:0 0 18px;color:#5b6784}
button{border:0;border-radius:8px;padding:11px 18px;background:#24396a;color:#fff;font:600 1rem Barlow;cursor:pointer}
button:focus-visible{outline:3px solid #8fb0ff;outline-offset:1px}
</style></head><body><main class="card"><h1 id="h">Cuenta activada</h1>
<p>Tu acceso ya funciona. Tu tablero con los vehículos que te asigne el taller estará disponible muy pronto.</p>
<button id="s">Salir</button></main>
<script>
fetch("/api/auth/yo").then(async r=>{if(!r.ok)return location.href="/";const j=await r.json();
 if(j.rol=="admin")return location.href="/panel.html";document.getElementById("h").textContent="Hola, "+j.usuario}).catch(()=>{});
document.getElementById("s").onclick=async()=>{await fetch("/api/auth/logout",{method:"POST"});location.href="/"};
</script></body></html>
