<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0b1b3a">
<title>Taller · AppXpand</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.5 Barlow,system-ui,sans-serif;color:#14213d;background:#0b1b3a;display:grid;place-items:center;padding:20px}
.w{width:100%;max-width:400px}.brand{color:#fff;font:700 1.15rem "Barlow Semi Condensed";margin-bottom:14px}.brand b{color:#8fb0ff}
.card{background:#fff;border-radius:10px;padding:26px 24px}h1{font:700 1.7rem "Barlow Semi Condensed";margin:0 0 4px}
p{margin:0 0 14px;color:#5b6784}label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid #d5dbe7;border-radius:8px;font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #8fb0ff;outline-offset:1px}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:14px}
button{width:100%;margin-top:18px;border:0;border-radius:8px;padding:12px;background:#24396a;color:#fff;font:600 1rem Barlow;cursor:pointer}
#m{min-height:1.4em;margin-top:12px;color:#b3261e;font-size:.92rem}
</style></head><body><div class="w"><div class="brand">Taller <b>AppXpand</b></div>
<form class="card" id="f"><h1>Acceso del taller</h1><p>Entra con tu usuario de administrador.</p>
<label for="u">Usuario</label><input type="text" id="u" autocomplete="username" required>
<label for="p">Contraseña</label><input type="password" id="p" autocomplete="current-password" required>
<label class="chk"><input type="checkbox" id="k"> Mantener sesión en este dispositivo</label>
<button>Entrar</button><div id="m" role="status" aria-live="polite"></div></form></div>
<script>
const $=i=>document.getElementById(i);
fetch("/api/auth/yo").then(r=>r.ok&&(location.href="/panel.html")).catch(()=>{});
$("f").onsubmit=async e=>{e.preventDefault();$("m").textContent="Entrando…";
 const r=await fetch("/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({usuario:$("u").value,password:$("p").value,mantener:$("k").checked})});
 if(r.ok)location.href="/panel.html";else $("m").textContent=(await r.json().catch(()=>({}))).error||"No se ha podido entrar. Inténtalo de nuevo."};
</script></body></html>
