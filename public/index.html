<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0b1b3a">
<title>Taller · AppXpand</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.5 Barlow,system-ui,sans-serif;color:#14213d;background:#0b1b3a;display:grid;place-items:center;padding:20px}
.w{width:100%;max-width:400px}.brand{color:#fff;font:700 1.15rem "Barlow Semi Condensed";margin-bottom:14px}.brand b{color:#8fb0ff}
.card{background:#fff;border-radius:10px;padding:26px 24px}h1{font:700 1.7rem "Barlow Semi Condensed";margin:0 0 4px}
p{margin:0 0 14px;color:#5b6784}label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid #d5dbe7;border-radius:8px;font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #8fb0ff;outline-offset:1px}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:14px}
.btn{width:100%;margin-top:18px;border:0;border-radius:8px;padding:12px;background:#24396a;color:#fff;font:600 1rem Barlow;cursor:pointer}
.lnk{display:block;margin:14px auto 0;background:none;border:0;color:#24396a;font:600 .92rem Barlow;text-decoration:underline;cursor:pointer}
.plate{font:700 1.5rem "Barlow Semi Condensed",monospace;letter-spacing:.18em;text-align:center;text-transform:uppercase;background:#f6f2df;border:2px solid #14213d!important;border-left:14px solid #1c4fd8!important}
#m{min-height:1.4em;margin-top:12px;color:#b3261e;font-size:.92rem}#m.ok{color:#1f7a4d}.hide{display:none}
</style></head><body><div class="w"><div class="brand">Taller <b>AppXpand</b></div>
<div class="card">
<form id="f"><h1>Acceso al taller</h1><p>Entra con tu usuario y contraseña.</p>
<label for="u">Usuario</label><input type="text" id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label for="p">Contraseña</label><input type="password" id="p" autocomplete="current-password" autocapitalize="none" autocorrect="off" required>
<label class="chk"><input type="checkbox" id="k"> Mantener sesión en este dispositivo</label>
<button class="btn">Entrar</button><button type="button" class="lnk" id="ir-alta">Tengo un código de alta</button><button type="button" class="lnk" id="ir-olvido">He olvidado mi contraseña</button></form>
<form id="a" class="hide" autocomplete="off"><h1>Activa tu cuenta</h1><p>Usa el código que te ha dado tu taller.</p>
<label for="ac">Código de alta</label><input type="text" id="ac" class="plate" maxlength="10" required placeholder="A1B2C3D4E5">
<label for="au">Elige un usuario</label><input type="text" id="au" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label for="ap">Crea una contraseña (mínimo 8 caracteres)</label><input type="password" id="ap" autocomplete="new-password" minlength="8" required>
<button class="btn">Crear mi cuenta</button><button type="button" class="lnk" id="ir-login">Volver a entrar</button></form>
<form id="r" class="hide" autocomplete="off"><h1>Nueva contraseña</h1><p>Pide a tu taller un código de restablecimiento y escríbelo aquí. Vale 24 horas y una sola vez.</p>
<label for="ru">Tu usuario</label><input type="text" id="ru" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label for="rc">Código de restablecimiento</label><input type="text" id="rc" class="plate" maxlength="10" required placeholder="A1B2C3D4E5">
<label for="rp">Contraseña nueva (mínimo 8 caracteres)</label><input type="password" id="rp" autocomplete="new-password" minlength="8" maxlength="200" required>
<button class="btn">Cambiar contraseña</button><button type="button" class="lnk" id="ir-login2">Volver a entrar</button></form>
<div id="m" role="status" aria-live="polite"></div></div></div>
<script>
const $=i=>document.getElementById(i),msg=(t,ok)=>{$("m").textContent=t||"";$("m").className=ok?"ok":""};
const post=(r,b)=>fetch("/api/auth/"+r,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});
const err=async r=>(await r.json().catch(()=>({}))).error||"Algo ha fallado. Inténtalo de nuevo.";
const dest=rol=>location.href=rol=="admin"?"/panel.html":"/mecanico.html";
const vista=v=>{$("f").classList.toggle("hide",v!="f");$("a").classList.toggle("hide",v!="a");$("r").classList.toggle("hide",v!="r");msg("")};
$("ir-alta").onclick=()=>vista("a");$("ir-login").onclick=()=>vista("f");$("ir-olvido").onclick=()=>{$("ru").value=$("u").value;vista("r")};$("ir-login2").onclick=()=>vista("f");
fetch("/api/auth/yo").then(async r=>{if(r.ok)dest((await r.json()).rol)}).catch(()=>{});
$("f").onsubmit=async e=>{e.preventDefault();msg("Entrando…");
 const r=await post("login",{usuario:$("u").value,password:$("p").value,mantener:$("k").checked});
 r.ok?dest((await r.json()).rol):msg(await err(r))};
$("a").onsubmit=async e=>{e.preventDefault();msg("Creando tu cuenta…");
 const r=await post("activar",{codigo:$("ac").value,usuario:$("au").value,password:$("ap").value});
 if(r.ok){$("u").value=$("au").value;$("p").value="";vista("f");msg("Cuenta creada. Ya puedes entrar.",true);$("p").focus()}else msg(await err(r))};
$("r").onsubmit=async e=>{e.preventDefault();msg("Cambiando la contraseña…");
 const r=await post("restablecer",{usuario:$("ru").value,codigo:$("rc").value,password:$("rp").value});
 if(r.ok){$("u").value=$("ru").value;$("p").value="";$("rc").value="";$("rp").value="";vista("f");msg("Contraseña cambiada. Ya puedes entrar con la nueva.",true);$("p").focus()}else msg(await err(r))};
</script></body></html>
