<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0b1b3a">
<title>Panel · Taller AppXpand</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1b3a;--steel:#24396a;--paper:#eef1f6;--ink:#14213d;--mute:#5b6784;--line:#d5dbe7;--ok:#1f7a4d;--plate:#f6f2df;--r:10px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:16px/1.45 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,.mat{font-family:"Barlow Semi Condensed",sans-serif;margin:0}
button,select,input,textarea{font:inherit}
.top{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font:700 1.15rem "Barlow Semi Condensed";margin-right:6px}.brand b{color:#8fb0ff}
nav{display:flex;gap:6px;flex:1}nav button{border:0;background:none;color:#cfd8ee;padding:7px 12px;border-radius:8px;font-weight:600;cursor:pointer}
nav button.on{background:#ffffff22;color:#fff}
.demo{font-size:.82rem;color:#9fb0d6}.demo select{margin-left:6px;padding:4px;border-radius:6px}
main{padding:16px}
.bar{margin-bottom:12px}.bar select{margin-left:6px;padding:6px;border-radius:8px;border:1px solid var(--line)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 260px;background:#e3e8f1;border-radius:var(--r);padding:10px;min-height:140px}
.col h2{font-size:1.05rem;display:flex;justify-content:space-between;margin-bottom:8px}.col h2 span{color:var(--mute)}
.vac{color:var(--mute);font-size:.88rem;margin:6px 2px}
.tj{background:#fff;border-radius:8px;padding:8px;margin-bottom:8px;display:flex;gap:10px;cursor:pointer;box-shadow:0 1px 2px #0002}
.tj img,.sf{width:64px;height:64px;border-radius:6px;object-fit:cover;flex:none;background:#dfe4ee;color:var(--mute);font-size:.7rem;display:grid;place-items:center;text-align:center}
.tj small{display:block;color:var(--mute);line-height:1.25}.tj .mec{color:var(--steel);font-weight:600}
.mat{display:inline-block;background:var(--plate);border:1.5px solid var(--ink);border-left:8px solid #1c4fd8;border-radius:4px;padding:0 8px;letter-spacing:.12em;font-size:1.05rem}
.card{background:#fff;border-radius:var(--r);padding:18px;max-width:720px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #8fb0ff;outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer}
.chips input{width:auto}
.btn{border:0;border-radius:8px;padding:10px 16px;background:var(--steel);color:#fff;font-weight:600;cursor:pointer}.btn.sec{background:#e3e8f1;color:var(--ink)}
.hide{display:none!important}
dialog{border:0;border-radius:14px;padding:0;width:min(720px,100%);max-height:92vh}dialog::backdrop{background:#0b1b3acc}
.fh{display:flex;gap:14px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.fh img,.fh .sf{width:92px;height:92px;border-radius:8px;object-fit:cover}
.fb{padding:4px 16px 18px}.fb h2{font-size:1.1rem;margin:18px 0 6px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}td:last-child,th:last-child{text-align:right}
.tot{text-align:right;margin-top:8px}.ok{color:var(--ok);font-weight:600}.mute{color:var(--mute)}
.hist{padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.sw{appearance:none;width:46px;height:28px;border-radius:14px;background:#c3cad9;position:relative;cursor:pointer;flex:none;padding:0;border:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .15s}
.sw:checked{background:var(--ok)}.sw:checked::after{transform:translateX(18px)}
.swl{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:500}.swl .sw{width:46px}
.mec-f{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.cod{font:700 1.8rem "Barlow Semi Condensed",monospace;letter-spacing:.2em;margin:14px 0 4px;word-break:break-all}
.chip{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:10px;background:#e3e8f1;color:var(--mute)}.chip.pendiente{background:#dbe6ff;color:#1c4fd8}.chip.usada{background:#d9f2e4;color:var(--ok)}
.bdg{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:#e5484d;color:#fff;font-size:.75rem;font-weight:700;text-align:center}.vbp{color:#b45309;font-weight:600}
.chip.fin{background:#d9f2e4;color:var(--ok)}
.vis{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;font:inherit;color:inherit}.vis:hover{background:#f3f6fb}
.gr{margin-top:14px}.gr .cab{margin-bottom:6px}.sm{padding:4px 10px;font-size:.85rem}.btn:disabled{opacity:.6;cursor:wait}
.cl{border:1px solid var(--line);border-radius:10px;padding:14px}.enl{margin-top:12px;background:var(--paper);padding:12px;border-radius:8px}.enl input{width:100%}.btn[disabled]{opacity:.5;cursor:not-allowed}
.fa-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
</style></head>
<body>
<header class="top"><span class="brand">Taller <b>AppXpand</b></span><nav id="nav"></nav>
<button class="btn sec" onclick="salir()">Salir</button></header>
<main id="v"></main>
<dialog id="fd"></dialog>
<script>
const ESTADOS=["Recibido","Diagnóstico","Esperando aprobación","En reparación","Listo","Entregado"];
/* DATOS DE DEMO: cada método de D pasará a ser una llamada a la API */
const D={yo:"admin",vb:true,
 equipo:[{u:"admin",n:"Admin",rol:"admin",libre:true}],
 motivos:["Revisión","Aceite y filtros","Frenos","Neumáticos","Diagnóstico de avería","Aire acondicionado","Embrague","Distribución","Sistema eléctrico","Carrocería"],
 ordenes:[
 {id:"1",mat:"4821KLM",marca:"Seat",modelo:"León",anio:2018,km:96400,cli:"Ana Ruiz",tel:"600111222",mot:["Frenos"],otro:"",estado:"Diagnóstico",mec:"marcos",notas:"Pastillas delanteras al límite.",fotos:[],pres:[],vb:"",fecha:"12/11/2026"},
 {id:"2",mat:"7733HJB",marca:"Renault",modelo:"Clio",anio:2015,km:142000,cli:"Pedro Gil",tel:"600333444",mot:["Distribución"],otro:"Ruido al arrancar",estado:"Recibido",mec:"",notas:"",fotos:[],pres:[],vb:"",fecha:"14/11/2026"},
 {id:"3",mat:"1190GTR",marca:"Ford",modelo:"Focus",anio:2020,km:58200,cli:"Marta Sanz",tel:"600555666",mot:["Aceite y filtros","Revisión"],otro:"",estado:"En reparación",mec:"lucia",notas:"",fotos:[],pres:[{c:"Aceite 5W30",t:"Pieza",i:48},{c:"Mano de obra",t:"Mano de obra",i:35}],vb:"ok",fecha:"13/11/2026"},
 {id:"4",mat:"4821KLM",marca:"Seat",modelo:"León",anio:2018,km:81000,cli:"Ana Ruiz",tel:"600111222",mot:["Neumáticos"],otro:"",estado:"Entregado",mec:"marcos",notas:"Cambio de 4 neumáticos.",fotos:[],pres:[{c:"Neumáticos x4",t:"Pieza",i:360}],vb:"ok",fecha:"02/03/2026"}]};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yo=()=>D.equipo.find(u=>u.u===D.yo),adm=()=>yo().rol==="admin",nom=u=>D.equipo.find(x=>x.u===u)?.n||"Sin asignar";
const vis=()=>D.ordenes.filter(o=>o.estado!=="Entregado"&&(adm()||o.mec===D.yo));
const mots=o=>[...o.mot,...(o.otro?[o.otro]:[])].join(", ");
const eur=x=>x.toLocaleString("es-ES",{style:"currency",currency:"EUR"}),tot=o=>o.pres.reduce((s,l)=>s+ +l.i,0);
let vista="tablero",F="*",cur=null,fotoTmp="";
const ir=v=>{vista=v;pintar()};
const NAVS=[["tablero","Tablero"],["buscar","Buscar"],["aprobar","Por aprobar"],["facturas","Facturas"],["entrada","Nueva entrada"],["equipo","Equipo"],["ajustes","Ajustes"]];
const pend=()=>D.ordenes.filter(o=>o.vb==="pendiente"&&o.estado!=="Entregado");
function nav(){const n=pend().length;document.title=(n?`(${n}) `:"")+"Panel · Taller AppXpand";
 $("#nav").innerHTML=NAVS.map(([k,t])=>`<button class="${vista==k?"on":""}" onclick="ir('${k}')">${t}${k=="aprobar"&&n?` <span class="bdg">${n}</span>`:""}</button>`).join("")}
function pintar(){nav();({tablero,buscar,aprobar,facturas,entrada,equipo,ajustes})[vista]()}

/* 1. TABLERO */
/* Respuesta del cliente al presupuesto (la IP y el navegador solo les llegan al admin) */
const decBadge=o=>{const d=(o.presV||[]).at(-1)?.dec;return d?`<small class="${d.resultado=="aprobado"?"ok":"vbp"}">Cliente ${d.resultado=="aprobado"?"aprobó":"rechazó"} el presupuesto</small>`:""};
const decTxt=v=>{const d=v?.dec;if(!d)return"";const ok=d.resultado=="aprobado",f=new Date(d.fecha).toLocaleString("es-ES",{timeZone:"Europe/Madrid",dateStyle:"short",timeStyle:"short"});
 return `<p class="${ok?"ok":"vbp"}" style="margin:0 0 8px">${ok?"✓ El cliente aprobó":"✕ El cliente rechazó"} la v${v.n} · ${f}</p>${d.mensaje?`<p style="margin:0 0 8px">«${esc(d.mensaje)}»</p>`:""}${d.ip?`<p class="mute" style="font-size:.82rem;margin:0 0 8px">Constancia: IP ${esc(d.ip)} · ${esc(d.ua||"navegador desconocido")} · huella ${esc(String(d.huella||"").slice(0,12))}</p>`:""}`};
const tarjeta=o=>`<article class="tj" draggable="true" ondragstart="event.dataTransfer.setData('t','${o.id}')" onclick="abrir('${o.id}')">${o.foto?`<img src="${src(o.foto)}" alt="">`:`<div class="sf">Sin foto</div>`}<div><span class="mat">${esc(o.mat)}</span><div>${esc(o.marca)} ${esc(o.modelo)}</div><small>${esc(mots(o))}</small>${decBadge(o)}${o.vb=="pendiente"?'<small class="vbp">Pendiente de visto bueno</small>':""}${adm()?`<small class="mec">${esc(nom(o.mec))}</small>`:""}</div></article>`;
function tablero(){let os=vis();if(adm()&&F!="*")os=os.filter(o=>F=="-"?!o.mec:o.mec==F);
 $("#v").innerHTML=(adm()?`<div class="bar"><label style="display:inline;font-weight:600">Mostrar<select onchange="F=this.value;tablero()" style="width:auto"><option value="*">Todos</option><option value="-" ${F=="-"?"selected":""}>Sin asignar</option>${D.equipo.map(u=>`<option value="${u.u}" ${F==u.u?"selected":""}>${esc(u.n)}</option>`).join("")}</select></label></div>`:"")
 +`<div class="board">`+ESTADOS.map(e=>{const l=os.filter(o=>o.estado==e);return `<section class="col" ondragover="event.preventDefault()" ondrop="mover(event,'${e}')"><h2>${e}<span>${l.length}</span></h2>${e=="Entregado"?'<p class="vac">Suelta aquí el coche al entregarlo. Sale del tablero y queda en su historial.</p>':l.map(tarjeta).join("")||'<p class="vac">Sin vehículos</p>'}</section>`}).join("")+`</div>`}
async function mover(ev,e){ev.preventDefault();const o=D.ordenes.find(x=>x.id==ev.dataTransfer.getData("t"));if(!o||o.estado===e)return;
 const ant=o.estado;o.estado=e;tablero();if(await save(o,["estado"])==0)o.estado=ant;if(vista=="tablero")tablero()}
/* BUSCADOR: matrícula, cliente, teléfono o modelo, incluidos los coches ya entregados */
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""),nTxt=s=>norm(s).replace(/\s+/g," ").trim(),nClave=s=>norm(s).replace(/[^a-z0-9]/g,"");
const nMat=s=>String(s??"").toUpperCase().replace(/[^A-Z0-9]/g,""),fechaHora=t=>new Date(t).toLocaleString("es-ES",{timeZone:"Europe/Madrid",dateStyle:"short",timeStyle:"short"});
const coincide=(o,q)=>{const hay=nTxt([o.mat,o.cli,o.tel,o.marca,o.modelo,o.otro].join(" ")),m=nClave(o.mat),t=nClave(o.tel);
 return nTxt(q).split(" ").filter(Boolean).every(w=>{const c=nClave(w);return hay.includes(w)||(c&&(m.includes(c)||t.includes(c)))})};
let BQ="";
function buscar(){$("#v").innerHTML=`<div class="card"><h1>Buscar</h1><label for="q">Matrícula, cliente, teléfono o modelo</label><input id="q" type="search" value="${esc(BQ)}" placeholder="Ej.: 4821KLM o Ana Ruiz" autocomplete="off" autocapitalize="none" oninput="BQ=this.value;resultados()"><div id="res"></div></div>`;resultados()}
function resultados(){const box=$("#res");if(!box)return;const q=BQ.trim();
 if(!q){box.innerHTML='<p class="mute" style="margin-top:12px">Escribe para buscar entre todos los vehículos, también los ya entregados.</p>';return}
 const placas=new Set(D.ordenes.filter(o=>coincide(o,q)).map(o=>nMat(o.mat)));
 if(!placas.size){box.innerHTML='<p class="mute" style="margin-top:12px">Sin resultados.</p>';return}
 box.innerHTML=[...placas].slice(0,30).map(m=>{const v=D.ordenes.filter(o=>nMat(o.mat)==m).sort((a,b)=>(b.creado||0)-(a.creado||0)),u=v[0];
  return `<div class="gr"><div class="cab"><span class="mat">${esc(u.mat)}</span> <b>${esc(u.marca)} ${esc(u.modelo)}</b> <span class="mute">${u.anio||""}</span><div>${esc(u.cli)} · <a href="tel:${esc(u.tel)}">${esc(u.tel)}</a></div></div>`
   +v.map(o=>`<button class="vis" onclick="abrir('${o.id}')"><b>${esc(o.fecha)}</b><span>${esc(mots(o))}</span><span class="chip ${o.estado=="Entregado"?"fin":""}">${esc(o.estado)}</span><span class="mute">${esc(nom(o.mec))}${tot(o)?" · "+eur(tot(o)*1.21):""}</span></button>`).join("")+`</div>`}).join("")
  +(placas.size>30?'<p class="mute">Hay más resultados: afina la búsqueda.</p>':"")}


/* 2. ENTRADA DE VEHÍCULO (solo admin) */
async function entrada(){if(API)await cargar(); // lista de mecánicos y motivos al día (p. ej. alguien recién dado de alta)
 const mec=D.equipo.map(u=>`<option value="${u.u}">${esc(u.n)}</option>`).join("");
 $("#v").innerHTML=`<form class="card" onsubmit="guardar(event)"><h1>Nueva entrada</h1>
 <div class="grid"><div><label>Matrícula</label><input id="e-mat" required onblur="auto()" style="text-transform:uppercase"></div><div><label>Kilómetros</label><input id="e-km" type="number" min="0" required></div>
 <div><label>Marca</label><input id="e-marca" required></div><div><label>Modelo</label><input id="e-modelo" required></div><div><label>Año</label><input id="e-anio" type="number" min="1950" max="2030" required></div>
 <div><label>Foto del vehículo</label><input id="e-foto" type="file" accept="image/*" capture="environment" onchange="leer(this)"></div>
 <div><label>Cliente</label><input id="e-cli" required></div><div><label>Teléfono</label><input id="e-tel" type="tel" required></div></div>
 <label>Motivo de la visita</label><div class="chips">${D.motivos.map(m=>`<label><input type="checkbox" name="mot" value="${esc(m)}">${esc(m)}</label>`).join("")}<label><input type="checkbox" id="e-otrochk" onchange="$('#e-otro').classList.toggle('hide',!this.checked)">Otro</label></div>
 <input id="e-otro" class="hide" placeholder="Describe el motivo" style="margin-top:8px">
 <label>Asignar a</label><select id="e-mec"><option value="">Sin asignar</option>${mec}</select>
 <p style="margin-top:18px"><button class="btn">Registrar entrada</button></p></form>`}
function leer(i){const f=i.files[0];if(f)comprime(f).then(d=>fotoTmp=d)}
function auto(){const m=nMat($("#e-mat").value),o=[...D.ordenes].sort((a,b)=>(b.creado||0)-(a.creado||0)).find(x=>nMat(x.mat)==m);if(!o)return;
 ["marca","modelo","anio","cli","tel"].forEach(k=>$("#e-"+(k)).value=o[k])}
async function guardar(ev){ev.preventDefault();const g=i=>$("#e-"+i).value.trim();
 const mot=[...document.querySelectorAll("[name=mot]:checked")].map(x=>x.value),otro=$("#e-otrochk").checked?g("otro"):"";
 if(!mot.length&&!otro)return alert("Elige al menos un motivo.");
 try{const o={mat:g("mat"),marca:g("marca"),modelo:g("modelo"),anio:+g("anio"),km:+g("km"),cli:g("cli"),tel:g("tel"),mot,otro,mec:$("#e-mec").value};
 if(fotoTmp)o.foto=await subir(fotoTmp);
 D.ordenes.push(API?await api("ordenes","POST",o):{...o,id:String(Date.now()),estado:"Recibido",notas:"",fotos:[],pres:[],vb:"",fecha:new Date().toLocaleDateString("es-ES")});
 fotoTmp="";F="*";ir("tablero")}catch(x){alert(x.message)}}

/* 3. FICHA DE ORDEN (+ 4. HISTORIAL del coche) */
let ED=false;
const entradaHtml=o=>ED?formEd(o):`<h2>Entrada <button class="btn sec sm" style="margin-left:8px" onclick="ED=true;ficha()">Editar datos</button></h2><div>${esc(o.cli)} · <a href="tel:${esc(o.tel)}">${esc(o.tel)}</a></div><div class="mute">${esc(mots(o))}</div>`;
function formEd(o){const ms=[...new Set([...D.motivos,...o.mot])],v=k=>esc(o[k]??"");
 return `<h2>Corregir datos de la entrada</h2><form onsubmit="guardarEd(event)"><div class="grid">
 <div><label for="x-mat">Matrícula</label><input id="x-mat" required value="${v("mat")}" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase"></div><div><label for="x-km">Kilómetros</label><input id="x-km" type="number" inputmode="numeric" min="0" required value="${v("km")}"></div>
 <div><label for="x-marca">Marca</label><input id="x-marca" required value="${v("marca")}"></div><div><label for="x-modelo">Modelo</label><input id="x-modelo" required value="${v("modelo")}"></div><div><label for="x-anio">Año</label><input id="x-anio" type="number" inputmode="numeric" min="1950" max="2030" required value="${v("anio")}"></div><div></div>
 <div><label for="x-cli">Cliente</label><input id="x-cli" required value="${v("cli")}"></div><div><label for="x-tel">Teléfono</label><input id="x-tel" type="tel" required value="${v("tel")}"></div></div>
 <label>Motivo de la visita</label><div class="chips">${ms.map(m=>`<label><input type="checkbox" name="xmot" value="${esc(m)}" ${o.mot.includes(m)?"checked":""}>${esc(m)}</label>`).join("")}<label><input type="checkbox" id="x-otrochk" ${o.otro?"checked":""} onchange="$('#x-otro').classList.toggle('hide',!this.checked)">Otro</label></div>
 <input id="x-otro" class="${o.otro?"":"hide"}" placeholder="Describe el motivo" value="${v("otro")}" style="margin-top:8px">
 <p style="margin-top:14px"><button class="btn">Guardar cambios</button> <button type="button" class="btn sec" onclick="ED=false;ficha()">Cancelar</button></p></form>`}
async function guardarEd(ev){ev.preventDefault();const g=i=>$("#x-"+i).value.trim(),o=cur;
 const mot=[...document.querySelectorAll("[name=xmot]:checked")].map(x=>x.value),otro=$("#x-otrochk").checked?g("otro"):"";
 if(!mot.length&&!otro)return alert("Elige al menos un motivo.");
 const n={mat:nMat(g("mat")),marca:g("marca"),modelo:g("modelo"),anio:+g("anio")||0,km:Math.round(+g("km")||0),cli:g("cli"),tel:g("tel"),mot,otro};
 const ks=Object.keys(n).filter(k=>JSON.stringify(n[k])!==JSON.stringify(o[k]??(k=="mot"?[]:"")));
 if(ks.length&&!await save(o,ks,n))return; // error de validación: el formulario se queda como está para corregirlo
 ED=false;ficha()}
function abrir(id){cur=D.ordenes.find(o=>o.id==id);ED=false;ficha()}
function ficha(){const o=cur,a=adm(),libre=a||yo().libre||!D.vb,hist=D.ordenes.filter(x=>x.mat==o.mat&&x.id!=o.id);
 const vb=o.vb=="ok"?'<span class="ok">Presupuesto aprobado</span>':o.vb=="pendiente"?(a?'<button class="btn" onclick="setVB(\'ok\')">Dar visto bueno</button>':'<span class="mute">Pendiente del visto bueno del taller</span>'):(libre?'<button class="btn" onclick="setVB(\'ok\')">Cerrar presupuesto</button>':'<button class="btn" onclick="setVB(\'pendiente\')">Pedir visto bueno</button>');

/* GUARDADO CON CONTROL DE VERSIÓN. Cada orden lleva un número de versión (rev). Se envía la que tenías en pantalla y SOLO los campos que cambias:
   si otra persona ha cambiado ESE mismo campo mientras tanto, el servidor no pisa su cambio: devuelve la orden actual (409) y aquí se carga.
   Si ha tocado otros campos distintos, se fusiona sin molestar. Devuelve 1 = guardado, 2 = conflicto (se ha cargado lo último), 0 = error.
   Las escrituras se encolan para que dos clics seguidos no choquen entre sí; el contenido se lee en el momento de enviar. */
let COLA=Promise.resolve();
const save=(o,ks,vals,mudo)=>COLA=COLA.then(()=>guarda(o,ks,vals,mudo),()=>guarda(o,ks,vals,mudo));
async function guarda(o,ks,vals,mudo){
 if(!API){if(vals)Object.assign(o,vals);return 1}
 try{Object.assign(o,await api("ordenes/"+o.id,"PUT",{rev:o.rev||0,...Object.fromEntries(ks.map(k=>[k,vals&&k in vals?vals[k]:o[k]]))}));return 1}
 catch(x){if(x.actual){Object.assign(o,x.actual);if(!mudo)alert(x.message);return 2}if(!mudo)alert("No se ha podido guardar: "+x.message);return 0}}
// Aplica un cambio local, lo guarda y redibuja la ficha. Si falla, deshace el cambio local.
async function edita(ks,fn){const o=cur,ant=JSON.stringify(ks.map(k=>o[k]));fn(o);
 if(await save(o,ks)==0)JSON.parse(ant).forEach((v,i)=>o[ks[i]]=v);ficha()}
async function cambia(k,v){const o=cur,ant=o[k];o[k]=v;const r=await save(o,[k]);if(r==0)o[k]=ant;if(r!=1)ficha()}
const subir=async d=>API?(await api("fotos","POST",{data:d})).id:d;
const comprime=async f=>{const b=await createImageBitmap(f),k=Math.min(1,1000/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*k;c.height=b.height*k;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.72)};

 if(!reactivar&&!confirm(`¿Dar de baja a ${u}?`+(n?` Sus ${n} vehículos pasarán a "Sin asignar" para que los reasignes.`:"")))return;
 await api("equipo/"+u,"PATCH",{activo:reactivar});let fallos=0;

/* COPIA DE SEGURIDAD: Excel (CSV) con las órdenes, o ZIP completo (datos + CSV + fotos) armado aquí en el navegador */
const hoyISO=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Madrid"});
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){ // ZIP sin compresión (las fotos ya son JPEG); nombres en UTF-8
 const enc=new TextEncoder(),d=new Date(),hora=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),fecha=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),partes=[],cd=[];let off=0;
 for(const f of files){const n=enc.encode(f.name),crc=crc32(f.data),lh=new DataView(new ArrayBuffer(30)),ch=new DataView(new ArrayBuffer(46));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,hora,true);lh.setUint16(12,fecha,true);lh.setUint32(14,crc,true);lh.setUint32(18,f.data.length,true);lh.setUint32(22,f.data.length,true);lh.setUint16(26,n.length,true);
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,hora,true);ch.setUint16(14,fecha,true);ch.setUint32(16,crc,true);ch.setUint32(20,f.data.length,true);ch.setUint32(24,f.data.length,true);ch.setUint16(28,n.length,true);ch.setUint32(42,off,true);
  partes.push(lh,n,f.data);cd.push(ch,n);off+=30+n.length+f.data.length}
 const tam=cd.reduce((s,x)=>s+(x.byteLength??x.length),0),fin=new DataView(new ArrayBuffer(22));
 fin.setUint32(0,0x06054b50,true);fin.setUint16(8,files.length,true);fin.setUint16(10,files.length,true);fin.setUint32(12,tam,true);fin.setUint32(16,off,true);
 return new Blob([...partes,...cd,fin],{type:"application/zip"})}
// "blob" = bytes tal cual (imprescindible para el CSV: text() descarta el BOM y Excel rompería los acentos)
async function bajar(ruta,tipo){const r=await fetch(ruta);if(!r.ok){let m="Algo ha fallado ("+r.status+")";try{m=(await r.json()).error||m}catch(x){}throw new Error(m)}return tipo=="blob"?new Uint8Array(await r.arrayBuffer()):r.text()}
function guardaArchivo(blob,nombre){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),6e4)}
const bkEst=(t,ok)=>{const e=$("#bk-est");if(e){e.textContent=t;e.style.color=ok?"var(--ok)":""}},bkBtn=d=>document.querySelectorAll(".bk-b").forEach(b=>b.disabled=d);
async function copiaCsv(){bkBtn(true);bkEst("Preparando el Excel…");try{guardaArchivo(new Blob([await bajar("/api/export?formato=csv","blob")],{type:"text/csv;charset=utf-8"}),`taller-ordenes-${hoyISO()}.csv`);bkEst("Excel descargado.",1)}catch(x){bkEst("No se ha podido: "+x.message)}bkBtn(false)}
async function copiaZip(){bkBtn(true);const enc=new TextEncoder();
 try{bkEst("Descargando los datos…");const json=await bajar("/api/export?formato=json"),csv=await bajar("/api/export?formato=csv","blob"),ids=JSON.parse(json).fotos||[];
  const files=[{name:"datos.json",data:enc.encode(json)},{name:"ordenes.csv",data:csv}],falta=[];let hechas=0,i=0;
  const hilo=async()=>{while(i<ids.length){const id=ids[i++];try{files.push({name:`fotos/${id}.jpg`,data:await bajar("/api/fotos/"+id,"blob")})}catch(x){falta.push(id)}bkEst(`Descargando fotos… ${++hechas} de ${ids.length}`)}};
  await Promise.all([hilo(),hilo(),hilo(),hilo()]);
  files.push({name:"LEEME.txt",data:enc.encode(`Copia de seguridad del taller · ${hoyISO()}\r\n\r\ndatos.json  → todas las órdenes, el equipo (sin contraseñas) y los ajustes. Cada orden indica sus fotos por identificador.\r\nordenes.csv → una fila por orden, para abrir con Excel.\r\nfotos/      → una imagen .jpg por foto; el nombre del archivo es el identificador que aparece en datos.json.\r\n`+(falta.length?`\r\nNo se pudieron descargar ${falta.length} fotos: ${falta.join(", ")}\r\n`:""))});
  bkEst("Empaquetando…");guardaArchivo(zip(files),`taller-copia-${hoyISO()}.zip`);
  try{localStorage.setItem("ultimaCopia",new Date().toISOString())}catch(x){}
  bkEst(`Copia descargada: ${JSON.parse(json).ordenes.length} órdenes y ${ids.length-falta.length} fotos.`+(falta.length?` ${falta.length} fotos no se pudieron bajar.`:""),!falta.length);
  const u=$("#bk-ult");if(u)u.textContent=ultimaCopia()}
 catch(x){bkEst("No se ha podido hacer la copia: "+x.message)}bkBtn(false)}
const ultimaCopia=()=>{try{const t=localStorage.getItem("ultimaCopia");return t?"Última copia completa descargada desde este navegador: "+fechaHora(t):"Aún no has descargado ninguna copia completa desde este navegador."}catch(x){return""}};
const copiaHtml=()=>`<div class="card" style="margin-top:14px"><h2 style="font-size:1.2rem">Copia de seguridad</h2>${!API?'<p class="mute">Sin conexión con el servidor: modo demostración.</p>':`<p class="mute">Descarga tus datos y guárdalos fuera de esta aplicación (tu ordenador, un disco o tu nube). Lo recomendable es una copia completa cada semana.</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn bk-b" onclick="copiaZip()">Copia completa (datos + fotos)</button><button class="btn sec bk-b" onclick="copiaCsv()">Órdenes para Excel</button></div>
 <p id="bk-est" class="mute" role="status" aria-live="polite" style="margin:10px 0 0"></p><p id="bk-ult" class="mute" style="margin:4px 0 0;font-size:.88rem">${ultimaCopia()}</p>`}</div>`;

let FISC={},FISCOK=false;
async function cargarFiscal(){if(!API)return;try{const r=await api("fiscal");FISC=r.fiscal||{};FISCOK=r.completo}catch(x){}}
const fiscalInner=()=>!API?'<p class="mute">Sin conexión con el servidor: modo demostración.</p>':`<h2 style="font-size:1.2rem">Datos fiscales del taller</h2>
 <p class="mute" style="margin:6px 0 12px">Aparecen en las facturas. Sin ellos no se puede emitir ninguna. ${FISCOK?'<b class="ok">Completos</b>':'<b style="color:#b3261e">Incompletos</b>'}</p>
 <div class="grid"><div><label>Razón social o nombre</label><input id="f-razon" value="${esc(FISC.razon)}"></div><div><label>NIF / CIF</label><input id="f-nif" value="${esc(FISC.nif)}" style="text-transform:uppercase"></div>
 <div style="grid-column:1/-1"><label>Dirección</label><input id="f-dir" value="${esc(FISC.dir)}"></div>
 <div><label>Código postal</label><input id="f-cp" value="${esc(FISC.cp)}" inputmode="numeric" maxlength="5"></div><div><label>Municipio</label><input id="f-ciudad" value="${esc(FISC.ciudad)}"></div><div><label>Provincia</label><input id="f-provincia" value="${esc(FISC.provincia)}"></div></div>
 <label>Logo (opcional)</label><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${FISC.logo?`<img src="${FISC.logo}" alt="Logo" style="max-height:48px;max-width:160px">`:""}<input type="file" accept="image/png,image/jpeg" onchange="subeLogo(this)" style="width:auto">${FISC.logo?'<button class="btn sec" onclick="quitaLogo()">Quitar logo</button>':""}</div>
 <p style="margin-top:16px"><button class="btn" onclick="guardaFiscal()">Guardar datos fiscales</button></p><div id="f-msg" class="mute"></div>`;
const pintaFiscal=()=>{$("#fiscal").innerHTML=fiscalInner()};
const leeFiscal=()=>{for(const k of ["razon","nif","dir","cp","ciudad","provincia"])FISC[k]=$("#f-"+k).value};
async function guardaFiscal(){leeFiscal();try{const r=await api("fiscal","PUT",FISC);FISC=r.fiscal;FISCOK=r.completo;pintaFiscal();$("#f-msg").textContent="Guardado."}catch(x){$("#f-msg").textContent=x.message;$("#f-msg").style.color="#b3261e"}}
async function subeLogo(i){const f=i.files[0];if(!f)return;try{leeFiscal();const b=await createImageBitmap(f),k=Math.min(1,400/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
 const x=c.getContext("2d");x.drawImage(b,0,0,c.width,c.height);let d=c.toDataURL("image/png");
 if(d.length>270000){x.globalCompositeOperation="destination-over";x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);d=c.toDataURL("image/jpeg",.8)}
 FISC.logo=d;pintaFiscal()}catch(e){alert("No se ha podido leer la imagen")}}
function quitaLogo(){leeFiscal();FISC.logo="";pintaFiscal()}
