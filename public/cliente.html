<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b1b3a">
<title>Estado de tu vehículo</title>
<style>
/* Sin fuentes externas a propósito: así el navegador del cliente no se conecta a terceros */
:root{--navy:#0b1b3a;--steel:#24396a;--bg:#eef1f6;--card:#fff;--ink:#14213d;--mute:#5b6784;--line:#d9dfeb;--ok:#17653f;--okbg:#e4f4ea;--warn:#8a4b08;--warnbg:#fff1dc;--err:#a32222;--errbg:#fde8e8;--plate:#f6f2df;--accent:#1c4fd8;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0d1424;--card:#16203a;--ink:#e8edf8;--mute:#9fb0d6;--line:#2a3857;--ok:#6fd49c;--okbg:#10301f;--warn:#f5b45f;--warnbg:#3a2a10;--err:#ff9a9a;--errbg:#3b1717;--plate:#f6f2df;--accent:#8fb0ff}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2,p{margin:0}
.hd{background:var(--navy);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 74px;margin:0 -14px;text-align:left}
.hd .hi{color:#aebfe6;font-size:.95rem}.hd h1{font-size:1.6rem;line-height:1.2;margin-top:2px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-top:14px;box-shadow:0 1px 3px #0b1b3a22}
.pull{margin-top:-52px}
.plate{display:inline-block;background:var(--plate);color:#14213d;border:2px solid #14213d;border-left:12px solid var(--accent);border-radius:6px;padding:1px 12px;font:700 1.45rem/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em}
.vn{margin-top:8px;font-size:1.1rem;font-weight:600}
.est{margin-top:14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;background:#dbe5ff;color:#16327f}
@media (prefers-color-scheme:dark){.pill{background:#223566;color:#d6e2ff}}
.pill.fin{background:var(--okbg);color:var(--ok)}.pill.esp{background:var(--warnbg);color:var(--warn)}
.est p{color:var(--mute);flex-basis:100%}
.prog{display:flex;gap:4px;margin-top:16px}.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}.prog i.on{background:var(--accent)}
.paso{color:var(--mute);font-size:.88rem;margin-top:6px}
h2{font-size:1.15rem;margin-bottom:10px}
.ask{background:var(--warnbg);color:var(--warn);border:0;border-radius:var(--r);padding:14px 16px;margin-top:14px;width:100%;text-align:left;font:inherit;font-weight:700;cursor:pointer;min-height:52px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 26px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:5px;top:8px;bottom:-8px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:0;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--line)}
.tl li.hoy::after{border-color:var(--accent);background:var(--accent)}
.tl b{display:block}.tl small{color:var(--mute)}
.mute{color:var(--mute)}.big{font-size:1.9rem;font-weight:800;line-height:1.1}
.notas{white-space:pre-wrap;overflow-wrap:anywhere}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fotos button{padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--line);cursor:pointer;display:block}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
table{width:100%;border-collapse:collapse}
td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;white-space:nowrap;padding-left:12px;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--mute)}
.sum{display:flex;justify-content:space-between;padding-top:8px;color:var(--mute);font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:6px;border-top:2px solid var(--ink);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.res{border-radius:12px;padding:14px;margin-top:16px}
.res.ok{background:var(--okbg);color:var(--ok)}.res.no{background:var(--warnbg);color:var(--warn)}.res.err{background:var(--errbg);color:var(--err)}
.res b{display:block}.res p{margin-top:6px;color:var(--ink)}
label{display:block;font-weight:600;margin:18px 0 6px}
textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;resize:vertical;min-height:84px}
textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btns{display:grid;gap:10px;margin-top:14px}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:14px 16px;min-height:52px;cursor:pointer;border:2px solid transparent}
.btn.si{background:var(--ok);color:#fff}@media (prefers-color-scheme:dark){.btn.si{background:#2f9e68;color:#04170d}}
.btn.no{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sec{background:var(--steel);color:#fff}
.btn:disabled{opacity:.55;cursor:wait}
.peq{font-size:.85rem;color:var(--mute);margin-top:12px}
.pie{text-align:center;color:var(--mute);font-size:.85rem;margin-top:22px;padding:0 10px}
dialog{border:0;border-radius:18px;padding:20px;width:min(440px,calc(100% - 28px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0b1b3acc}
dialog.foto{padding:0;background:#000;width:min(720px,100%);max-height:92vh;overflow:hidden}
dialog.foto img{width:100%;max-height:82vh;object-fit:contain;display:block}
dialog.foto button{width:100%;border-radius:0}
.centro{text-align:center;padding:64px 12px}
.centro .ico{font-size:2.6rem}.centro h1{font-size:1.3rem;margin:10px 0 6px}.centro p{color:var(--mute)}
.sk{height:14px;border-radius:7px;background:var(--line);margin:10px 0}
</style></head>
<body>
<main id="app" aria-live="polite"><div class="hd"><p class="hi">&nbsp;</p><h1>Cargando…</h1></div><div class="card pull"><div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk" style="width:70%"></div></div></main>
<dialog id="conf" aria-labelledby="conf-t"><h2 id="conf-t"></h2><p id="conf-p"></p><div class="btns"><button class="btn" id="conf-ok"></button><button class="btn no" id="conf-no">Volver</button></div></dialog>
<dialog id="fo" class="foto" aria-label="Foto"><img alt="Foto ampliada"><button class="btn sec" id="fo-x">Cerrar</button></dialog>
<script>
const ESTADOS=["Recibido","Diagnóstico","Esperando aprobación","En reparación","Listo","Entregado"];
const TXT={"Recibido":"Hemos recibido tu vehículo.","Diagnóstico":"Estamos revisando qué le pasa.","Esperando aprobación":"Necesitamos tu respuesta al presupuesto.","En reparación":"Estamos trabajando en él.","Listo":"Ya puedes pasar a recogerlo.","Entregado":"Entregado. ¡Gracias por confiar en nosotros!"};
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(n);
const TZ="Europe/Madrid",fHora=t=>new Date(t).toLocaleString("es-ES",{timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}),
 fDia=t=>new Date(t).toLocaleDateString("es-ES",{timeZone:TZ,day:"numeric",month:"long",year:"numeric"}),
 fLarga=t=>new Date(t).toLocaleString("es-ES",{timeZone:TZ,dateStyle:"long",timeStyle:"short"});

// El enlace lleva el token tras «#»: el navegador no lo envía al servidor al pedir la página.
const token=decodeURIComponent(location.hash.slice(1));
let D=null,msg="",enviando=false,nota=null;
const post=(ruta,body)=>fetch("/api/cliente"+ruta,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token,...body}),cache:"no-store",referrerPolicy:"no-referrer"});

function pantalla(ico,tit,txt){app.innerHTML=`<div class="centro"><div class="ico" aria-hidden="true">${ico}</div><h1>${esc(tit)}</h1><p>${esc(txt)}</p></div>`;document.title=tit}
function fallo(status,txt){
 if(status===410)return pantalla("⏳","Este enlace ha caducado",txt||"Pídele un enlace nuevo al taller.");
 if(status===429)return pantalla("⏱️","Demasiados intentos",txt||"Prueba de nuevo en unos minutos.");
 if(status===404)return pantalla("🔗","Este enlace no es válido",txt||"Comprueba que lo has copiado entero o pídele uno nuevo al taller.");
 pantalla("⚠️","No hemos podido cargar la página",txt||"Inténtalo de nuevo en un momento.")}

async function cargar(primera){
 try{
  const r=await post("",{}),j=await r.json().catch(()=>({}));
  if(!r.ok){if(primera||r.status===404||r.status===410)fallo(r.status,j.error);return}
  if(JSON.stringify(j)!==JSON.stringify(D)){D=j;pinta()}
 }catch(e){if(primera)fallo(0,"Parece que no hay conexión.")}
}

/* ---------- pintar ---------- */
function pinta(){
 const d=D,v=d.vehiculo,i=Math.max(0,ESTADOS.indexOf(d.estado)),p=d.presupuesto,nombre=String(d.cliente||"").trim().split(/\s+/)[0];
 const pendiente=p&&!p.decision;
 document.title=`${v.mat} · Estado de tu vehículo`;
 const lin=d.linea||[];
 app.innerHTML=`
 <div class="hd"><p class="hi">${nombre?`Hola, ${esc(nombre)}`:"Hola"}</p><h1>Así va tu vehículo</h1></div>
 <section class="card pull" aria-label="Vehículo y estado">
  <span class="plate">${esc(v.mat)}</span>
  <p class="vn">${esc(v.marca)} ${esc(v.modelo)}${v.anio?` · ${esc(v.anio)}`:""}</p>
  <div class="est"><span class="pill ${d.estado==="Listo"||d.estado==="Entregado"?"fin":d.estado==="Esperando aprobación"?"esp":""}">${esc(d.estado)}</span><p>${esc(TXT[d.estado]||"")}</p></div>
  <div class="prog" role="img" aria-label="Paso ${i+1} de ${ESTADOS.length}">${ESTADOS.map((e,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
  <p class="paso">Paso ${i+1} de ${ESTADOS.length}</p>
 </section>
 ${pendiente?`<button class="ask" data-act="ir">Tienes un presupuesto pendiente de tu respuesta · Verlo ↓</button>`:""}
 ${d.motivos?.length?`<section class="card"><h2>Motivo de la visita</h2><p>${d.motivos.map(esc).join(" · ")}</p></section>`:""}
 ${d.notas?`<section class="card"><h2>Mensaje del taller</h2><p class="notas">${esc(d.notas)}</p></section>`:""}
 ${d.fotos?.length?`<section class="card"><h2>Fotos</h2><div class="fotos">${d.fotos.map(f=>`<button data-act="foto" data-id="${esc(f)}" aria-label="Ver foto ampliada"><img alt="" data-f="${esc(f)}"></button>`).join("")}</div></section>`:""}
 <section class="card" id="presu" aria-label="Presupuesto">${presupuesto(p)}</section>
 ${lin.length?`<section class="card"><h2>Seguimiento</h2><ol class="tl">${lin.map((x,k)=>`<li class="${k===lin.length-1?"hoy":""}"><b>${esc(x.estado)}</b><small>${x.aprox?"Fecha aproximada: "+fDia(x.fecha):fHora(x.fecha)}</small></li>`).join("")}</ol></section>`:""}
 <p class="pie">Este enlace es personal: no lo compartas.<br>Válido hasta el ${fDia(d.vence)}.</p>`;
 cargaFotos();
 const t=$("#msg");if(t)t.value=msg;
}

function presupuesto(p){
 if(!p)return `<h2>Presupuesto</h2><p class="mute">Todavía no hay presupuesto. Cuando el taller lo tenga listo lo verás aquí.</p>`;
 const dec=p.decision,aviso=nota&&!(dec&&nota.t==="ok")?`<div class="res ${nota.t}" role="status"><b>${esc(nota.x)}</b></div>`:"";
 let acc="";
 if(dec){
  const ok=dec.resultado==="aprobado";
  acc=`<div class="res ${ok?"ok":"no"}"><b>${ok?"✓ Has aprobado este presupuesto":"✕ Has rechazado este presupuesto"}</b><span>${fLarga(dec.fecha)}</span>${dec.mensaje?`<p>Tu mensaje: «${esc(dec.mensaje)}»</p>`:""}${ok?"":`<p>Si quieres cambiar algo, díselo al taller: te enviará un presupuesto nuevo.</p>`}</div>`;
 }else acc=`<label for="msg">Mensaje para el taller (opcional)</label>
  <textarea id="msg" maxlength="500" placeholder="Por ejemplo: «Adelante, pero no cambiéis las llantas»"></textarea>
  <div class="btns"><button class="btn si" data-act="aprobar" ${enviando?"disabled":""}>Aprobar presupuesto</button><button class="btn no" data-act="rechazar" ${enviando?"disabled":""}>No lo apruebo</button></div>
  <p class="peq">Solo puedes responder una vez a cada presupuesto. Como constancia, el taller guarda la fecha y la hora, y los datos técnicos de tu conexión (IP y navegador).</p>`;
 return `<h2>Presupuesto${p.n>1?` (versión ${p.n})`:""}</h2><p class="mute" style="margin:-6px 0 8px">Enviado el ${fDia(p.enviada)}</p>
 <table>${p.lineas.map(l=>`<tr><td>${esc(l.c)}<small>${esc(l.t)}</small></td><td>${eur(+l.i)}</td></tr>`).join("")}</table>
 <div class="sum"><span>Base imponible</span><span>${eur(p.base)}</span></div><div class="sum"><span>IVA 21 %</span><span>${eur(p.iva)}</span></div>
 <div class="tot"><span>Total</span><span>${eur(p.total)}</span></div>${aviso}${acc}`;
}

/* ---------- fotos: se piden con el token en el cuerpo y se muestran como blob (sin token en ninguna URL) ---------- */
const FOTOS=new Map();
function cargaFotos(){document.querySelectorAll("img[data-f]").forEach(async img=>{
 const id=img.dataset.f;
 if(!FOTOS.has(id))FOTOS.set(id,post("/foto",{id}).then(r=>r.ok?r.blob():Promise.reject()).then(b=>URL.createObjectURL(b)));
 try{img.src=await FOTOS.get(id)}catch(e){FOTOS.delete(id);img.alt="No se pudo cargar la foto"}})}
async function verFoto(id){try{const u=await FOTOS.get(id);if(!u)return;$("#fo img").src=u;$("#fo").showModal()}catch(e){}}
$("#fo-x").onclick=()=>$("#fo").close();
$("#fo").addEventListener("click",e=>{if(e.target===$("#fo"))$("#fo").close()});

/* ---------- aprobar / rechazar ---------- */
const conf=$("#conf");
function pregunta(a){
 const p=D.presupuesto,si=a==="aprobar";
 $("#conf-t").textContent=si?"¿Aprobar el presupuesto?":"¿Rechazar el presupuesto?";
 $("#conf-p").textContent=si?`Vas a aprobar el presupuesto de ${eur(p.total)} (IVA incluido). Después no podrás cambiar tu respuesta.`:`Vas a decir que no al presupuesto de ${eur(p.total)}. Después no podrás cambiar tu respuesta; el taller podrá enviarte uno nuevo.`;
 const ok=$("#conf-ok");ok.textContent=si?"Sí, aprobar":"Sí, rechazar";ok.className="btn "+(si?"si":"sec");
 ok.onclick=()=>enviar(a);conf.showModal()}
$("#conf-no").onclick=()=>conf.close();

async function enviar(a){
 const p=D.presupuesto;conf.close();enviando=true;nota=null;pinta();
 try{
  const r=await post("/decision",{n:p.n,huella:p.huella,decision:a,mensaje:msg.trim()}),j=await r.json().catch(()=>({}));
  if(r.ok){p.decision=j.decision;msg="";nota={t:"ok",x:a==="aprobar"?"¡Gracias! El taller ya sabe que has aprobado el presupuesto.":"Hecho. El taller sabe que no lo apruebas."}}
  else{if(j.decision)p.decision=j.decision;nota={t:"err",x:j.error||"No se ha podido enviar. Inténtalo de nuevo."};if(r.status===409&&!j.decision){D=null;await cargar(false)}}
 }catch(e){nota={t:"err",x:"Sin conexión: no se ha enviado nada. Inténtalo de nuevo."}}
 enviando=false;pinta();$("#presu")?.scrollIntoView({behavior:"smooth",block:"center"})}

app.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
 if(a==="aprobar"||a==="rechazar")pregunta(a);
 else if(a==="foto")verFoto(b.dataset.id);
 else if(a==="ir")$("#presu").scrollIntoView({behavior:"smooth"})});
app.addEventListener("input",e=>{if(e.target.id==="msg")msg=e.target.value});

/* ---------- arranque ---------- */
if(!/^[A-Za-z0-9_-]{32}$/.test(token))fallo(404);
else{cargar(true);
 setInterval(()=>{if(!document.hidden&&!enviando&&!conf.open&&!$("#fo").open&&document.activeElement?.id!=="msg")cargar(false)},60000);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!enviando&&!conf.open)cargar(false)})}
</script>
</body></html>
