[build]
  publish = "public"
[build.environment]
  NODE_VERSION = "22"
[functions]
  directory = "netlify/functions"

# Portal del cliente: el enlace lleva un token, así que nada de referrers, cachés ni terceros
[[headers]]
  for = "/cliente.html"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
